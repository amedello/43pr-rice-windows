<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script src="./babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM • HH:mm', locale: 'it-IT' },
        battery: { type: 'battery' },
        memory: { type: 'memory' },
        media: { type: 'media' },
        audio: { type: 'audio' },
        weather: { type: 'weather',  latitude: 41.277486,   longitude: 16.417833 }
      });

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        // Get icon to show for current network status.
        function getNetworkIcon(networkOutput) {
          if (!networkOutput) return <i className="nf nf-md-wifi_strength_off_outline"></i>;
          switch (networkOutput.defaultInterface?.type) {
            case 'ethernet':
              return <i className="nf nf-md-ethernet_cable"></i>;
            case 'proprietary_virtual':
              return <i className="nf nf-md-shield_lock_outline"></i>;
            case 'wifi':
              if (networkOutput.defaultGateway?.signalStrength >= 80) {
                return <i className="nf nf-md-wifi_strength_4"></i>;
              } else if (networkOutput.defaultGateway?.signalStrength >= 65) {
                return <i className="nf nf-md-wifi_strength_3"></i>;
              } else if (networkOutput.defaultGateway?.signalStrength >= 40) {
                return <i className="nf nf-md-wifi_strength_2"></i>;
              } else if (networkOutput.defaultGateway?.signalStrength >= 25) {
                return <i className="nf nf-md-wifi_strength_1"></i>;
              } else {
                return <i className="nf nf-md-wifi_strength_outline"></i>;
              }
            default:
              return <i className="nf nf-md-wifi_strength_off_outline"></i>;
          }
        }

        // Get icon to show for how much of the battery is charged.
        function getBatteryIcon(batteryOutput) {
          if (!batteryOutput) return <i className="nf nf-fa-battery_0"></i>;
          const charge = batteryOutput.chargePercent || 0;
          if (charge > 90) return <i className="nf nf-fa-battery_4"></i>;
          if (charge > 70) return <i className="nf nf-fa-battery_3"></i>;
          if (charge > 40) return <i className="nf nf-fa-battery_2"></i>;
          if (charge > 20) return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        function getAudioDeviceShortName(device) {
          if (!device || !device.name) return 'Audio';
          const name = device.name;
          const lower = name.toLowerCase();

          // Specific hardware branding / identifiers
          if (lower.includes('jabra')) return 'Jabra';
          if (lower.includes('wireless controller') || lower.includes('dualsense') || lower.includes('dualshock') || lower.includes('gamepad')) return 'Controller';
          if (lower.includes('p24') || lower.includes('thinkvision')) return 'P24h-30';
          if (lower.includes('s/pdif') || lower.includes('digital audio') || lower.includes('optical')) return 'S/PDIF';
          if (lower.includes('altoparlanti') || lower.includes('speakers')) return 'Altoparlanti';
          if (lower.includes('headset') || lower.includes('cuffie') || lower.includes('earphone') || lower.includes('headphones')) return 'Cuffie';

          // Clean up generic Windows driver suffixes for any other dynamic device
          let cleaned = name
            .replace(/\s*\((?:High Definition Audio Device|NVIDIA High Definition Audio|Realtek.*?|USB Audio.*?)\)/gi, '')
            .trim();

          if (cleaned.length > 14) {
            return cleaned.substring(0, 12) + '…';
          }
          return cleaned || name;
        }

        function getAudioDeviceIcon(device) {
          if (!device || !device.name) return 'nf-md-volume_high';
          const name = device.name.toLowerCase();
          if (name.includes('controller') || name.includes('gamepad') || name.includes('dualsense') || name.includes('dualshock')) {
            return 'nf-md-gamepad_variant';
          }
          if (name.includes('headset') || name.includes('cuffie') || name.includes('earphone') || name.includes('headphones') || name.includes('jabra') || name.includes('airpods') || name.includes('buds')) {
            return 'nf-md-headphones';
          }
          if (name.includes('digital') || name.includes('s/pdif') || name.includes('optical')) {
            return 'nf-md-audio_video';
          }
          if (name.includes('p24') || name.includes('monitor') || name.includes('hdmi') || name.includes('tv') || name.includes('display')) {
            return 'nf-md-monitor_speaker';
          }
          return 'nf-md-speaker';
        }

        function getWeatherIcon(weatherOutput) {
          if (!weatherOutput || !weatherOutput.status) return <i className="nf nf-weather-cloudy"></i>;
          switch (weatherOutput.status) {
            case 'clear_day':
              return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night':
              return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day':
              return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night':
              return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day':
            case 'heavy_rain_day':
              return <i className="nf nf-weather-day_rain"></i>;
            case 'light_rain_night':
            case 'heavy_rain_night':
              return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day':
            case 'snow_night':
              return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night':
              return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day':
            case 'thunder_night':
              return <i className="nf nf-weather-thunderstorm"></i>;
            default:
              return <i className="nf nf-weather-cloudy"></i>;
          }
        }

        function getActiveMediaSession(mediaOutput) {
          if (!mediaOutput) return null;
          const allSessions = mediaOutput.allSessions || [];

          // 1. Priorità assoluta: la sessione che sta attivamente suonando
          const playingSession = allSessions.find(s => s.isPlaying && s.title);
          if (playingSession) return playingSession;

          // 2. Seconda priorità: la sessione corrente indicata da Windows se ha un titolo valido
          if (mediaOutput.currentSession?.title) return mediaOutput.currentSession;

          // 3. Terza priorità: qualsiasi sessione rilevata con un titolo valido
          const anySession = allSessions.find(s => s.title);
          if (anySession) return anySession;

          return null;
        }

        // Mappa automatica processo Windows -> Icona Nerd Font
        function getProcessIcon(processName) {
          if (!processName) return null;
          const p = processName.toLowerCase();

          if (p.includes('edge') || p.includes('chrome') || p.includes('firefox') || p.includes('brave') || p.includes('duckduckgo') || p.includes('zen') || p.includes('opera') || p.includes('vivaldi')) {
            return 'nf-fa-globe';
          }
          if (p.includes('code') || p.includes('cursor') || p.includes('idea') || p.includes('devenv') || p.includes('antigravity') || p.includes('sublime') || p.includes('notepad')) {
            return 'nf-md-code_tags';
          }
          if (p.includes('terminal') || p.includes('powershell') || p.includes('cmd') || p.includes('wezterm') || p.includes('alacritty') || p.includes('kitty') || p.includes('bash')) {
            return 'nf-oct-terminal';
          }
          if (p.includes('spotify') || p.includes('music') || p.includes('tidal') || p.includes('foobar') || p.includes('vlc')) {
            return 'nf-fa-spotify';
          }
          if (p.includes('discord') || p.includes('telegram') || p.includes('slack') || p.includes('teams') || p.includes('whatsapp') || p.includes('signal')) {
            return 'nf-fa-comments';
          }
          if (p.includes('explorer')) {
            return 'nf-md-folder';
          }
          if (p.includes('steam') || p.includes('game') || p.includes('epic') || p.includes('gog') || p.includes('retroarch')) {
            return 'nf-md-gamepad_variant';
          }
          if (p.includes('taskmgr') || p.includes('settings') || p.includes('control') || p.includes('flow.launcher')) {
            return 'nf-md-cog';
          }
          if (p.includes('photoshop') || p.includes('gimp') || p.includes('figma') || p.includes('blender') || p.includes('obs')) {
            return 'nf-md-palette';
          }

          return 'nf-md-application';
        }

        function getWorkspaceIcons(workspace) {
          if (!workspace || !workspace.children) return [];
          const seen = new Set();
          const icons = [];
          for (const child of workspace.children) {
            const proc = child.processName;
            if (proc && !seen.has(proc.toLowerCase())) {
              seen.add(proc.toLowerCase());
              const icon = getProcessIcon(proc);
              if (icon) icons.push({ icon, name: proc });
            }
          }
          return icons;
        }

        const currentWorkspaces = output.glazewm?.currentWorkspaces || [];
        const currentSession = getActiveMediaSession(output.media);
        const isPlaying = Boolean(currentSession?.isPlaying || currentSession?.status === 'playing');
        const defaultAudio = output.audio?.defaultPlaybackDevice;

        const [osdInfo, setOsdInfo] = useState(null);
        const lastOsdVal = React.useRef(null);

        // Pomodoro Focus Timer State
        const [pomoState, setPomoState] = useState('idle'); // 'idle' | 'running' | 'paused'
        const [pomoMode, setPomoMode] = useState('work'); // 'work' (25m) | 'break' (5m)
        const [pomoSec, setPomoSec] = useState(25 * 60);

        useEffect(() => {
          if (pomoState !== 'running') return;
          const interval = setInterval(() => {
            setPomoSec((prev) => {
              if (prev <= 1) {
                const nextMode = pomoMode === 'work' ? 'break' : 'work';
                setPomoMode(nextMode);
                const nextSec = nextMode === 'work' ? 25 * 60 : 5 * 60;
                output.glazewm?.runCommand('shell-exec powershell -Command "[System.Media.SystemSounds]::Exclamation.Play()"');
                return nextSec;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(interval);
        }, [pomoState, pomoMode]);

        function togglePomodoro() {
          if (pomoState === 'idle') {
            setPomoMode('work');
            setPomoSec(25 * 60);
            setPomoState('running');
          } else if (pomoState === 'running') {
            setPomoState('paused');
          } else if (pomoState === 'paused') {
            setPomoState('running');
          }
        }

        function resetPomodoro(e) {
          if (e) e.preventDefault();
          setPomoState('idle');
          setPomoMode('work');
          setPomoSec(25 * 60);
        }

        function formatPomoTime(seconds) {
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // OSD trigger su variazione volume o dispositivo audio
        useEffect(() => {
          if (!defaultAudio) return;
          const currentKey = `${defaultAudio.name}_${Math.round(defaultAudio.volume || 0)}_${defaultAudio.isMuted}`;
          if (lastOsdVal.current && lastOsdVal.current !== currentKey) {
            setOsdInfo({
              title: getAudioDeviceShortName(defaultAudio),
              value: Math.round(defaultAudio.volume || 0),
              isMuted: defaultAudio.isMuted,
              icon: getAudioDeviceIcon(defaultAudio)
            });
            const timer = setTimeout(() => setOsdInfo(null), 1800);
            return () => clearTimeout(timer);
          }
          lastOsdVal.current = currentKey;
        }, [defaultAudio?.volume, defaultAudio?.name, defaultAudio?.isMuted]);

        return (
          <div className="app">
            <div className="left">
              {output.glazewm && (
                <div className="workspaces">
                  {currentWorkspaces.map(workspace => {
                    const wsIcons = getWorkspaceIcons(workspace);
                    const isFoc = Boolean(workspace.hasFocus);
                    const isDisp = Boolean(workspace.isDisplayed);
                    return (
                      <button
                        className={`workspace ${isFoc ? 'focused' : ''} ${isDisp ? 'displayed' : ''} ${wsIcons.length > 0 ? 'has-apps' : ''}`}
                        onClick={() =>
                          output.glazewm?.runCommand(
                            `focus --workspace ${workspace.name}`,
                          )
                        }
                        key={workspace.name}
                        title={`Workspace ${workspace.displayName ?? workspace.name}${wsIcons.length > 0 ? ': ' + wsIcons.map(a => a.name).join(', ') : ''}`}
                      >
                        <span className="ws-number">{workspace.displayName ?? workspace.name}</span>
                        {wsIcons.length > 0 && (
                          <span className="ws-icons">
                            {wsIcons.slice(0, 3).map((app, idx) => (
                              <i key={idx} className={`nf ${app.icon} ws-app-icon`}></i>
                            ))}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>
              )}

              {/* Audio Volume & Output Device Selector (after Workspaces, before Player) */}
              {defaultAudio && (
                <div
                  className="audio"
                  title={
                    `${defaultAudio.name || 'Dispositivo Audio'}\n` +
                    `Click: alterna uscita audio\n` +
                    (output.audio?.playbackDevices && output.audio.playbackDevices.length > 0
                      ? `\nDispositivi rilevati:\n` +
                        output.audio.playbackDevices
                          .map(d => `${d.name === defaultAudio.name ? '● ' : '○ '}${d.name}`)
                          .join('\n')
                      : '') +
                    `\n\nClick destro: impostazioni audio\nRotellina: alza / abbassa volume`
                  }
                  onWheel={(e) => {
                    if (e.deltaY < 0) {
                      output.glazewm?.runCommand(
                        'shell-exec D:/Progetto/scripts/media-ctl.exe vol_up',
                      );
                    } else {
                      output.glazewm?.runCommand(
                        'shell-exec D:/Progetto/scripts/media-ctl.exe vol_down',
                      );
                    }
                  }}
                  onClick={() =>
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe switch_audio',
                    )
                  }
                  onContextMenu={(e) => {
                    e.preventDefault();
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe sound_panel',
                    );
                  }}
                >
                  <span className="audio-device-name">
                    <i className={`nf ${getAudioDeviceIcon(defaultAudio)}`}></i>
                    <span>{getAudioDeviceShortName(defaultAudio)}</span>
                  </span>

                  <span className="vol-separator">•</span>

                  <button
                    className="vol-icon-btn"
                    title="Muto / Riattiva"
                    onClick={(e) => {
                      e.stopPropagation();
                      output.glazewm?.runCommand(
                        'shell-exec D:/Progetto/scripts/media-ctl.exe mute',
                      );
                    }}
                  >
                    <i
                      className={`nf ${
                        defaultAudio.isMuted
                          ? 'nf-md-volume_off'
                          : defaultAudio.volume > 50
                            ? 'nf-md-volume_high'
                            : defaultAudio.volume > 0
                              ? 'nf-md-volume_medium'
                              : 'nf-md-volume_low'
                      }`}
                    ></i>
                  </button>
                  <span
                    className="vol-text"
                    title="Click: scambia dispositivo (Cuffie/Casse) • Click destro: impostazioni"
                  >
                    {defaultAudio.isMuted
                      ? 'Muto'
                      : `${Math.round(defaultAudio.volume || 0)}%`}
                  </span>
                </div>
              )}

              {/* Music Player Pill with Play/Pause, Next/Prev, Wheel and Focus Player */}
              <div
                className={`music-pill ${currentSession?.title ? 'active' : 'idle'}`}
                title={
                  currentSession?.title
                    ? `${currentSession.title} - ${currentSession.artist || ''}\n• Click: porta applicazione in primo piano\n• Rotellina: traccia succ / prec`
                    : 'Nessun brano attivo'
                }
                onWheel={(e) => {
                  if (e.deltaY > 0) {
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe next',
                    );
                  } else {
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe prev',
                    );
                  }
                }}
              >
                <i
                  className="nf nf-md-music music-icon"
                  style={{ cursor: 'pointer' }}
                  title="Click: porta applicazione in primo piano"
                  onClick={() =>
                    output.glazewm?.runCommand(
                      currentSession?.title
                        ? `shell-exec D:/Progetto/scripts/media-ctl.exe focus_media "${encodeURIComponent(currentSession.title)}"`
                        : 'shell-exec D:/Progetto/scripts/media-ctl.exe focus_media',
                    )
                  }
                ></i>

                <span
                  className="music-text"
                  title="Click: porta applicazione in primo piano"
                  onClick={() =>
                    output.glazewm?.runCommand(
                      currentSession?.title
                        ? `shell-exec D:/Progetto/scripts/media-ctl.exe focus_media "${encodeURIComponent(currentSession.title)}"`
                        : 'shell-exec D:/Progetto/scripts/media-ctl.exe focus_media',
                    )
                  }
                >
                  {currentSession?.title ? (
                    <>
                      {currentSession.title}
                      {currentSession.artist && (
                        <span className="music-artist"> • {currentSession.artist}</span>
                      )}
                    </>
                  ) : (
                    'Musica'
                  )}
                </span>

                <div className="music-controls">
                  <button
                    className="media-btn"
                    title="Traccia precedente"
                    onClick={() =>
                      output.glazewm?.runCommand(
                        'shell-exec D:/Progetto/scripts/media-ctl.exe prev',
                      )
                    }
                  >
                    <i className="nf nf-md-skip_previous"></i>
                  </button>

                  <button
                    className={`media-btn play-pause ${isPlaying ? 'playing' : ''}`}
                    title={isPlaying ? 'Pausa' : 'Riproduci'}
                    onClick={() =>
                      output.glazewm?.runCommand(
                        'shell-exec D:/Progetto/scripts/media-ctl.exe toggle',
                      )
                    }
                  >
                    <i
                      className={`nf ${
                        isPlaying ? 'nf-md-pause' : 'nf-md-play'
                      }`}
                    ></i>
                  </button>

                  <button
                    className="media-btn"
                    title="Traccia successiva"
                    onClick={() =>
                      output.glazewm?.runCommand(
                        'shell-exec D:/Progetto/scripts/media-ctl.exe next',
                      )
                    }
                  >
                    <i className="nf nf-md-skip_next"></i>
                  </button>
                </div>
              </div>

              {output.glazewm?.focusedWindow?.title && (
                <div className="window-title">
                  <span>{output.glazewm.focusedWindow.title}</span>
                </div>
              )}
            </div>

            <div className="center">
              {osdInfo ? (
                <div className="osd-pill">
                  <i className={`nf ${osdInfo.isMuted ? 'nf-md-volume_off' : osdInfo.icon} osd-icon`}></i>
                  <span className="osd-title">{osdInfo.title}</span>
                  <div className="osd-track">
                    <div
                      className={`osd-fill ${osdInfo.isMuted ? 'muted' : ''}`}
                      style={{ width: `${osdInfo.isMuted ? 0 : osdInfo.value}%` }}
                    />
                  </div>
                  <span className="osd-val">{osdInfo.isMuted ? 'MUTO' : `${osdInfo.value}%`}</span>
                </div>
              ) : (
                <>
                  <div
                    className="clickable-pill date-text"
                    title="Click: apri Orologio e Sveglie"
                    onClick={() =>
                      output.glazewm?.runCommand(
                        'shell-exec D:/Progetto/scripts/media-ctl.exe calendar',
                      )
                    }
                  >
                    {output.date?.formatted}
                  </div>
                  <div
                    className={`pomodoro-pill ${pomoState} ${pomoMode}`}
                    onClick={togglePomodoro}
                    onContextMenu={resetPomodoro}
                    title={
                      pomoState === 'idle'
                        ? 'Pomodoro Focus Timer (Click: Avvia 25min)'
                        : `${pomoMode === 'work' ? 'Lavoro' : 'Pausa'}: ${formatPomoTime(pomoSec)}\n• Click: ${pomoState === 'running' ? 'Pausa' : 'Riprendi'}\n• Click Destro: Azzera`
                    }
                  >
                    <i className={`nf ${pomoMode === 'work' ? 'nf-md-timer_sand' : 'nf-md-coffee'} pomo-icon`}></i>
                    {pomoState !== 'idle' && (
                      <span className="pomo-text">{formatPomoTime(pomoSec)}</span>
                    )}
                  </div>
                </>
              )}
            </div>

            <div className="right">
              {output.glazewm && (
                <>
                  {output.glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() =>
                        output.glazewm?.runCommand('wm-toggle-pause')
                      }
                    >
                      PAUSED
                    </button>
                  )}
                  {output.glazewm.bindingModes?.map(bindingMode => (
                    <button
                      className="binding-mode"
                      key={bindingMode.name}
                      onClick={() =>
                        output.glazewm?.runCommand(
                          `wm-disable-binding-mode --name ${bindingMode.name}`,
                        )
                      }
                    >
                      {bindingMode.displayName ?? bindingMode.name}
                    </button>
                  ))}
                </>
              )}

              {/* Weather Pill */}
              {output.weather && (
                <div
                  className="weather clickable-pill"
                  title={`Meteo: ${output.weather.status?.replace(/_/g, ' ') || 'Condizioni attuali'} • ${Math.round(output.weather.celsiusTemp ?? output.weather.celsius ?? 0)}°C\nClick: apri previsioni meteo`}
                  onClick={() =>
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe weather',
                    )
                  }
                >
                  {getWeatherIcon(output.weather)}
                  <span>{Math.round(output.weather.celsiusTemp ?? output.weather.celsius ?? 0)}°C</span>
                </div>
              )}

              {output.network && (
                <div
                  className="network clickable-pill"
                  title="Stato Rete • Click: impostazioni connessione"
                  onClick={() =>
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe network',
                    )
                  }
                >
                  {getNetworkIcon(output.network)}
                  {output.network.defaultGateway?.ssid ||
                    (output.network.defaultInterface?.type === 'ethernet'
                      ? 'Ethernet'
                      : '')}
                </div>
              )}

              {output.memory && (
                <div
                  className="memory clickable-pill"
                  title="Uso RAM • Click: Gestione Attività (Task Manager)"
                  onClick={() =>
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe taskmgr',
                    )
                  }
                >
                  <i className="nf nf-fae-chip"></i>
                  {Math.round(output.memory.usage || 0)}%
                </div>
              )}

              {output.cpu && (
                <div
                  className="cpu clickable-pill"
                  title="Uso CPU • Click: Gestione Attività (Task Manager)"
                  onClick={() =>
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe taskmgr',
                    )
                  }
                >
                  <i className="nf nf-oct-cpu"></i>
                  <span
                    className={(output.cpu.usage || 0) > 85 ? 'high-usage' : ''}
                  >
                    {Math.round(output.cpu.usage || 0)}%
                  </span>
                </div>
              )}

              {output.battery && (
                <div className="battery">
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {getBatteryIcon(output.battery)}
                  {Math.round(output.battery.chargePercent || 0)}%
                </div>
              )}

              {/* Power / System Control Pill */}
              <div className="power-group">
                <button
                  className="power-btn theme"
                  title="43PR Theme Switcher (Alt + Shift + T)"
                  onClick={() =>
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe theme_picker',
                    )
                  }
                >
                  <i className="nf nf-md-palette"></i>
                </button>
                <button
                  className="power-btn reload"
                  title="Ricarica Barra Zebar (Alt + Shift + Z)"
                  onClick={() =>
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe restart_bar',
                    )
                  }
                >
                  <i className="nf nf-md-refresh"></i>
                </button>
                <button
                  className="power-btn lock"
                  title="Blocca sessione (Alt + Shift + Esc)"
                  onClick={() =>
                    output.glazewm?.runCommand(
                      'shell-exec D:/Progetto/scripts/media-ctl.exe lock',
                    )
                  }
                >
                  <i className="nf nf-md-lock_outline"></i>

                <button
                  className="power-btn sleep"

                >

                </button>
                <button

              </div>
            </div>
          </div>
        );
      }
    </script>
