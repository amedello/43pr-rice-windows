# 43PR GlazeWM Configuration (Windows Tiling Window Manager)
# Replicating 43PR/dotfiles Hyprland experience for Windows

general:
  cursor_jump:
    on_focus_window: false
  startup_commands:
    - 'shell-exec D:/Progetto/scripts/media-ctl.exe startup'
  shutdown_commands:
    - 'shell-exec taskkill /IM zebar.exe /F'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: true

gaps:
  scale_with_dpi: true
  inner_gap: "8px"
  outer_gap:
    top: "46px"    # Clearance for the floating 43PR Zebar top bar
    bottom: "8px"
    left: "8px"
    right: "8px"

window_effects:
  focused_window:
    border:
      enabled: true
      color: "#8839ef"   # Accent color (updated by theme engine)
    transparency:
      enabled: true
      opacity: "92%"
  other_windows:
    border:
      enabled: false
      color: "#1e1e2e"
    transparency:
      enabled: true
      opacity: "82%"
  hide_title_bar:
    enabled: true

workspaces:
  - name: "1"
    display_name: "1"
    keep_alive: true
  - name: "2"
    display_name: "2"
    keep_alive: true
  - name: "3"
    display_name: "3"
    keep_alive: true
  - name: "4"
    display_name: "4"
    keep_alive: true
  - name: "5"
    display_name: "5"
    keep_alive: true
  - name: "6"
    display_name: "6"
  - name: "7"
    display_name: "7"
  - name: "8"
    display_name: "8"
  - name: "9"
    display_name: "9"

window_rules:
  # Do not tile status bars, launchers and system utility overlays
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_process: { regex: '(?i)flow\.launcher' }
      - window_process: { regex: '(?i)powertoys' }
      - window_process: { equals: 'ScreenClippingHost' }
      - window_process: { equals: 'SnippingTool' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

  # Automatically float small popups, dialogs, and utility apps
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'CalculatorApp' }
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'control' }
      - window_process: { equals: 'SoundVolumeView' }
      - window_class: { equals: '#32770' }
      - window_title: { regex: '(?i)43pr scratchpad' }
      - window_title: { regex: '(?i)43pr clipboard' }
      - window_title: { regex: '(?i)43pr window switcher' }
      - window_title: { regex: '(?i)43pr color picker' }
      - window_title: { regex: '(?i)43pr calculator' }
      - window_title: { regex: '(?i)43pr hardware hud' }
      - window_title: { regex: '(?i)43pr theme switcher' }

  # Dedicated Workspaces for background apps
  - commands: ['move --workspace 9']
    match:
      - window_process: { equals: 'Spotify' }

keybindings:
  # =====================================================================
  # 43PR Essential Shortcuts (Super on Linux -> Alt on Windows)
  # =====================================================================
  # Launch Terminal (Super + T)
  - commands: ['shell-exec wt']
    bindings: ['alt+t']

  # Close Active Window (Super + Q)
  - commands: ['close']
    bindings: ['alt+q']

  # Application Launcher (Super + D handled natively by Flow Launcher with toggle support)

  # Cycle Wallpapers (Super + W)
  - commands: ['shell-exec powershell -ExecutionPolicy Bypass -WindowStyle Hidden -File D:/Progetto/scripts/wallpaper-picker.ps1']
    bindings: ['alt+w']

  # Select Wallpaper from Dialog (Super + Shift + W)
  - commands: ['shell-exec powershell -ExecutionPolicy Bypass -WindowStyle Hidden -File D:/Progetto/scripts/wallpaper-picker.ps1 -Select']
    bindings: ['alt+shift+w']

  # Quake-style Dropdown Terminal / Scratchpad (Super + U)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe toggle_scratchpad']
    bindings: ['alt+u']

  # Clipboard History Manager (Super + V)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe clipboard']
    bindings: ['alt+v']

  # Global Window Switcher & Jump (Super + Tab, Super + J)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe window_switcher']
    bindings: ['alt+tab', 'alt+j']

  # Instant Math & Unit Calculator (Super + C)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe calc']
    bindings: ['alt+c']

  # Color Picker Pipette Eyedropper (Super + Shift + C)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe color_picker']
    bindings: ['alt+shift+c']

  # 43PR Theme Switcher & Auto Day/Night (Super + Shift + T)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe theme_picker']
    bindings: ['alt+shift+t']

  # Hardware Telemetry & Sensors HUD (Super + Shift + M)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe sensors']
    bindings: ['alt+shift+m']

  # Zen Mode / Gaming Mode toggle (Super + Shift + G)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe zen_mode']
    bindings: ['alt+shift+g']

  # Power / Shutdown Menu (Super + Grave on US, Alt + \ on ITA, Alt + P fallback)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe power_menu']
    bindings: ['alt+oem_pipe', 'alt+p']

  # File Explorer (Super + E)
  - commands: ['shell-exec explorer.exe']
    bindings: ['alt+e']

  # Default Browser (Super + B)
  - commands: ['shell-exec cmd /c start http://']
    bindings: ['alt+b']

  # Toggle Windows Taskbar Auto-Hide (Super + Shift + B)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe toggle_taskbar']
    bindings: ['alt+shift+b']

  # Switch Audio Output Device (Super + Shift + A)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe switch_audio']
    bindings: ['alt+shift+a']

  # Cheatsheet & Shortcuts Helper (Alt + F1 or Alt + Shift + ?)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe cheatsheet']
    bindings: ['alt+shift+oem_question', 'alt+f1', 'alt+shift+f1']

  # Restart Zebar Bar (Super + Shift + Z)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe restart_bar']
    bindings: ['alt+shift+z']

  # Screenshot / Snipping Tool (Super + Shift + S)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe screenshot']
    bindings: ['alt+shift+s']

  # Lock Workstation (Super + Shift + Esc)
  - commands: ['shell-exec D:/Progetto/scripts/media-ctl.exe lock']
    bindings: ['alt+shift+escape']

  # Toggle Floating Window (Super + Space)
  - commands: ['toggle-floating']
    bindings: ['alt+space']

  # Toggle Fullscreen (Super + F)
  - commands: ['toggle-fullscreen --shown-on-top']
    bindings: ['alt+f']

  # Reload GlazeWM Configuration (Super + Shift + R)
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']

  # Exit / Pause GlazeWM (Super + Shift + Q)
  - commands: ['wm-exit']
    bindings: ['alt+shift+q']

  # =====================================================================
  # Window Focus Navigation (Vim keys & Arrows)
  # =====================================================================
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']

  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']

  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']

  # =====================================================================
  # Window Moving (Shift + Vim keys & Arrows)
  # =====================================================================
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']

  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']

  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']

  # =====================================================================
  # Workspace Switching (Super + 1..9)
  # =====================================================================
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  # =====================================================================
  # Move Window to Workspace (Super + Shift + 1..9)
  # =====================================================================
  - commands: ['move --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9']
    bindings: ['alt+shift+9']

  # =====================================================================
  # Layout Toggling
  # =====================================================================
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+s']














